name: Actions Lock

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/**' ]
  pull_request:
    branches: [ main ]
    paths: [ '.github/workflows/**' ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
